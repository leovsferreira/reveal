<div *ngIf="hasData" class="map-container" #mapContainer>
  <div class="polygon-controls">
    <button 
      class="polygon-btn" 
      [class.active]="isInDrawMode()"
      (click)="toggleDrawMode()"
      title="Draw Polygon (Toggle)"
      aria-label="Draw Polygon">
      <i class="fas fa-draw-polygon"></i>
    </button>
    
    <button 
      class="polygon-btn" 
      (click)="deleteSelectedPolygon()"
      title="Delete Selected Polygon"
      aria-label="Delete Selected Polygon">
      <i class="fas fa-eraser"></i>
    </button>
    
    <button 
      class="polygon-btn clear-btn" 
      (click)="clearAllPolygons()"
      title="Clear All Polygons"
      aria-label="Clear All Polygons">
      <i class="fas fa-trash"></i>
    </button>
  </div>

  <div *ngIf="heatmapGrid && heatmapInView" class="heatmap-legend">
    <div class="heatmap-legend-title">Images per cell (~{{ heatmapGrid.cellMeters | number:'1.0-0' }} m)</div>
    <div class="heatmap-legend-bar" [style.background]="heatmapLegendGradient"></div>
    <div class="heatmap-legend-labels">
      <span>0</span>
      <span>{{ heatmapGrid.maxCount }}</span>
    </div>
  </div>
</div>
